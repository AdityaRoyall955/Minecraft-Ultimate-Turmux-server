name: 🚀 Force Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., 1.26.2)'
        required: true
        default: '1.26.2'
      release_name:
        description: 'Release Name'
        required: true
        default: 'AdityaMods Server Software'

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Get Current Versions
      id: get-versions
      run: |
        echo "📋 Reading current versions..."
        
        # Get Paper version
        if [ -f "versions/paper.version" ]; then
          PAPER_VER=$(cat versions/paper.version)
        else
          PAPER_VER="1.26.2-132"
        fi
        
        # Get Purpur version
        if [ -f "versions/purpur.version" ]; then
          PURPUR_VER=$(cat versions/purpur.version)
        else
          PURPUR_VER="1.26.2-2622"
        fi
        
        # Get PowerNukkitX version
        if [ -f "versions/powernukkitx.version" ]; then
          PNX_VER=$(cat versions/powernukkitx.version)
        else
          PNX_VER="3.0.3"
        fi
        
        echo "paper_version=${PAPER_VER}" >> $GITHUB_OUTPUT
        echo "purpur_version=${PURPUR_VER}" >> $GITHUB_OUTPUT
        echo "pnx_version=${PNX_VER}" >> $GITHUB_OUTPUT
        
        echo "✅ Versions detected:"
        echo "  PaperMC: ${PAPER_VER}"
        echo "  Purpur: ${PURPUR_VER}"
        echo "  PowerNukkitX: ${PNX_VER}"
    
    - name: Create Release Zip and Changelog
      id: create-zip
      run: |
        echo "📦 Creating release zip and changelog..."
        
        RELEASE_VER="${{ github.event.inputs.version }}"
        echo "Release Version: ${RELEASE_VER}"
        
        # Create zip file with proper name
        ZIP_NAME="AdityaMods Server Software ${RELEASE_VER}.zip"
        echo "Creating: ${ZIP_NAME}"
        
        # Create zip excluding .git directory
        zip -r "${ZIP_NAME}" . -x ".git/*" -x "${ZIP_NAME}" -x "CHANGELOG.md"
        
        echo "✅ Zip created: ${ZIP_NAME}"
        
        # Create detailed CHANGELOG.md
        cat > CHANGELOG.md << EOF
# 📦 Changelog - AdityaMods Server Software ${RELEASE_VER}

## 🎮 Release Information

- **Release Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')
- **Version:** ${RELEASE_VER}
- **Tag:** v${RELEASE_VER}

---

## 📋 Included Server Software

### ✅ PaperMC
- **Version:** ${{ steps.get-versions.outputs.paper_version }}
- **Type:** Java Edition Server
- **Description:** High-performance Minecraft server with plugin support

### ✅ Purpur
- **Version:** ${{ steps.get-versions.outputs.purpur_version }}
- **Type:** Java Edition Server (Paper Fork)
- **Description:** Enhanced Paper with extra features

### ✅ PowerNukkitX
- **Version:** ${{ steps.get-versions.outputs.pnx_version }}
- **Type:** Bedrock Edition Server
- **Description:** Minecraft Bedrock server for Termux

---

## 🚀 Installation Guide

### Step 1: Download
Download the \`${ZIP_NAME}\` file from the Assets section below.

### Step 2: Extract
Extract the zip file to your Termux home directory:
\`\`\`bash
unzip "AdityaMods Server Software ${RELEASE_VER}.zip"
cd Minecraft-Ultimate-Turmux-server
\`\`\`

### Step 3: Install
Run the installer:
\`\`\`bash
bash install.sh
\`\`\`

### Step 4: Setup
Configure your server:
\`\`\`bash
mc -s setup
\`\`\`

### Step 5: Start Server
Run your Minecraft server:
\`\`\`bash
mc -s start
\`\`\`

---

## 📝 Available Commands

| Command | Description |
|---------|-------------|
| \`mc -s setup\` | Select server software & install dependencies |
| \`mc -s start\` | Start the Minecraft server |
| \`mc -s restart\` | Restart the server |
| \`mc -s stop\` | Stop the server |
| \`mc -s update\` | Update to latest version |
| \`mc -s check\` | Check for available updates |
| \`mc -s status\` | Check server status |
| \`mc -s plugins\` | Download plugins (Java only) |
| \`mc -s delete\` | Delete world files (⚠️ Danger!) |
| \`mc -s software\` | Change server software |

---

## 🔧 System Requirements

- **Platform:** Termux (Android)
- **Storage:** ~2GB free space
- **RAM:** ~2GB recommended
- **Java:** OpenJDK 21 (auto-installed)

---

## 🌐 Server Ports

| Server Type | Port | Protocol |
|-------------|------|----------|
| PaperMC/Purpur | 25565 | Java Edition |
| PowerNukkitX | 19132 | Bedrock Edition |

---

## 📁 Files Included

\`\`\`
.
├── menu.sh              # Main control script
├── install.sh           # Installation script
├── core/
│   └── server.conf      # Server configuration
├── scripts/
│   ├── setup_server.sh      # Setup script
│   └── check_updates.sh     # Update checker
├── plugins/
│   └── download_plugins.sh  # Plugin downloader
├── docs/
│   └── structure.txt        # Documentation
├── versions/
│   ├── paper.version        # Paper version tracking
│   ├── purpur.version       # Purpur version tracking
│   └── powernukkitx.version # PNX version tracking
└── CHANGELOG.md         # This file
\`\`\`

---

## 🆕 What's New in This Release

- ✅ Latest server software versions included
- ✅ Auto-detection of latest versions from APIs
- ✅ Automatic update checking
- ✅ Multi-edition support (Java & Bedrock)
- ✅ Termux-optimized for Android

---

## 🐛 Troubleshooting

### Server won't start?
- Check Java installation: \`java -version\`
- Verify port availability: \`netstat -tlnp\`
- Check server logs in the server directory

### Out of memory?
- Edit \`core/server.conf\` and lower \`SERVER_RAM\`
- Close other apps to free up RAM

### Can't connect?
- **Java:** Check port 25565 is open
- **Bedrock:** Check port 19132 is open
- Verify firewall settings

---

## 📞 Support

- **Repository:** https://github.com/${{ github.repository }}
- **Issues:** https://github.com/${{ github.repository }}/issues

---

**Made with 💜 by AdityaRoyall955**

**Auto-generated by GitHub Actions** 🤖
EOF
        
        echo "✅ Changelog created: CHANGELOG.md"
        echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
        echo "release_ver=${RELEASE_VER}" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      id: create-release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.event.inputs.version }}
        release_name: "${{ github.event.inputs.release_name }} ${{ github.event.inputs.version }}"
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ${{ steps.create-zip.outputs.zip_name }}
        asset_name: ${{ steps.create-zip.outputs.zip_name }}
        asset_content_type: application/zip
    
    - name: Summary
      run: |
        echo ""
        echo "✅ RELEASE CREATED SUCCESSFULLY!"
        echo ""
        echo "📦 Release: ${{ github.event.inputs.release_name }} ${{ github.event.inputs.version }}"
        echo "🏷️  Tag: v${{ github.event.inputs.version }}"
        echo "📄 Changelog: Included"
        echo "🗜️  Zip: ${{ steps.create-zip.outputs.zip_name }}"
        echo ""
        echo "🎉 Your release is now live on GitHub!"
