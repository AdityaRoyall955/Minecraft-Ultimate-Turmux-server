name: Auto Update Server JARs

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Check PaperMC Updates
      id: check-paper
      run: |
        echo "🔍 Auto-detecting latest PaperMC version..."
        
        # Auto-detect latest version from API
        PAPER_VERSION=$(curl -s https://api.papermc.io/v2/projects/paper | jq -r '.versions[-1]')
        PAPER_BUILD=$(curl -s "https://api.papermc.io/v2/projects/paper/versions/${PAPER_VERSION}/builds" | jq -r '.builds[-1].build')
        
        echo "Latest Paper: Version ${PAPER_VERSION}, Build ${PAPER_BUILD}"
        
        # Read current version
        if [ -f "versions/paper.version" ]; then
          CURRENT_PAPER=$(cat versions/paper.version)
        else
          CURRENT_PAPER="none"
        fi
        
        echo "Current: ${CURRENT_PAPER}"
        echo "Latest: ${PAPER_VERSION}-${PAPER_BUILD}"
        
        NEW_VERSION="${PAPER_VERSION}-${PAPER_BUILD}"
        
        if [ "$CURRENT_PAPER" != "$NEW_VERSION" ]; then
          echo "📥 New PaperMC version found: ${NEW_VERSION}"
          
          # Download new version
          DOWNLOAD_URL="https://api.papermc.io/v2/projects/paper/versions/${PAPER_VERSION}/builds/${PAPER_BUILD}/downloads/paper-${PAPER_VERSION}-${PAPER_BUILD}.jar"
          
          echo "URL: ${DOWNLOAD_URL}"
          
          # Update version file
          mkdir -p versions
          echo "${NEW_VERSION}" > versions/paper.version
          
          # Update menu.sh with new URL (using auto-detect pattern)
          sed -i "s|PAPER_VERSION=.*|PAPER_VERSION=\"${PAPER_VERSION}\"|" menu.sh 2>/dev/null || true
          
          echo "paper_updated=true" >> $GITHUB_OUTPUT
          echo "paper_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "paper_ver=${PAPER_VERSION}" >> $GITHUB_OUTPUT
          echo "✅ PaperMC updated to ${NEW_VERSION}"
        else
          echo "✓ PaperMC is up to date (${CURRENT_PAPER})"
          echo "paper_updated=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Check Purpur Updates
      id: check-purpur
      run: |
        echo "🔍 Auto-detecting latest Purpur version..."
        
        # Auto-detect latest version from API
        PURPUR_VERSION=$(curl -s https://api.purpurmc.org/v2/purpur | jq -r '.versions[-1]')
        PURPUR_BUILD=$(curl -s "https://api.purpurmc.org/v2/purpur/${PURPUR_VERSION}" | jq -r '.builds.all[-1]')
        
        echo "Latest Purpur: Version ${PURPUR_VERSION}, Build ${PURPUR_BUILD}"
        
        # Read current version
        if [ -f "versions/purpur.version" ]; then
          CURRENT_PURPUR=$(cat versions/purpur.version)
        else
          CURRENT_PURPUR="none"
        fi
        
        echo "Current: ${CURRENT_PURPUR}"
        echo "Latest: ${PURPUR_VERSION}-${PURPUR_BUILD}"
        
        NEW_VERSION="${PURPUR_VERSION}-${PURPUR_BUILD}"
        
        if [ "$CURRENT_PURPUR" != "$NEW_VERSION" ]; then
          echo "📥 New Purpur version found: ${NEW_VERSION}"
          
          # Build download URL
          PURPUR_URL="https://api.purpurmc.org/v2/purpur/${PURPUR_VERSION}/${PURPUR_BUILD}/download"
          
          echo "URL: ${PURPUR_URL}"
          
          # Update version file
          mkdir -p versions
          echo "${NEW_VERSION}" > versions/purpur.version
          
          echo "purpur_updated=true" >> $GITHUB_OUTPUT
          echo "purpur_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "purpur_ver=${PURPUR_VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Purpur updated to ${NEW_VERSION}"
        else
          echo "✓ Purpur is up to date (${CURRENT_PURPUR})"
          echo "purpur_updated=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Check PowerNukkitX Updates
      id: check-pnx
      run: |
        echo "🔍 Auto-detecting latest PowerNukkitX version..."
        
        # Get latest PowerNukkitX release from GitHub
        PNX_RELEASE=$(curl -s https://api.github.com/repos/PowerNukkitX/PowerNukkitX/releases/latest | jq -r '.tag_name')
        
        echo "Latest PowerNukkitX: ${PNX_RELEASE}"
        
        # Read current version
        if [ -f "versions/powernukkitx.version" ]; then
          CURRENT_PNX=$(cat versions/powernukkitx.version)
        else
          CURRENT_PNX="none"
        fi
        
        echo "Current: ${CURRENT_PNX}"
        echo "Latest: ${PNX_RELEASE}"
        
        if [ "$CURRENT_PNX" != "$PNX_RELEASE" ]; then
          echo "📥 New PowerNukkitX version found: ${PNX_RELEASE}"
          
          # Get download URL for new version
          PNX_URL=$(curl -s https://api.github.com/repos/PowerNukkitX/PowerNukkitX/releases/latest | jq -r '.assets[] | select(.name | contains("powernukkitx")) | .browser_download_url' | head -1)
          
          if [ -z "$PNX_URL" ]; then
            PNX_URL="https://github.com/PowerNukkitX/PowerNukkitX/releases/download/${PNX_RELEASE}/powernukkitx.jar"
          fi
          
          echo "URL: ${PNX_URL}"
          
          # Update version file
          mkdir -p versions
          echo "${PNX_RELEASE}" > versions/powernukkitx.version
          
          echo "pnx_updated=true" >> $GITHUB_OUTPUT
          echo "pnx_version=${PNX_RELEASE}" >> $GITHUB_OUTPUT
          echo "✅ PowerNukkitX updated to ${PNX_RELEASE}"
        else
          echo "✓ PowerNukkitX is up to date (${CURRENT_PNX})"
          echo "pnx_updated=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit and Push Changes
      if: steps.check-paper.outputs.paper_updated == 'true' || steps.check-purpur.outputs.purpur_updated == 'true' || steps.check-pnx.outputs.pnx_updated == 'true'
      run: |
        echo "📝 Committing updates..."
        
        # Build commit message
        COMMIT_MSG="Auto-update:"
        
        if [ "${{ steps.check-paper.outputs.paper_updated }}" == "true" ]; then
          COMMIT_MSG="${COMMIT_MSG} PaperMC ${{ steps.check-paper.outputs.paper_version }}"
        fi
        
        if [ "${{ steps.check-purpur.outputs.purpur_updated }}" == "true" ]; then
          COMMIT_MSG="${COMMIT_MSG} Purpur ${{ steps.check-purpur.outputs.purpur_version }}"
        fi
        
        if [ "${{ steps.check-pnx.outputs.pnx_updated }}" == "true" ]; then
          COMMIT_MSG="${COMMIT_MSG} PowerNukkitX ${{ steps.check-pnx.outputs.pnx_version }}"
        fi
        
        git add -A
        git commit -m "$COMMIT_MSG"
        git push
        
        echo "✅ Updates pushed to repository!"
    
    - name: Create Release Zip and Changelog
      if: steps.check-paper.outputs.paper_updated == 'true' || steps.check-purpur.outputs.purpur_updated == 'true' || steps.check-pnx.outputs.pnx_updated == 'true'
      run: |
        echo "📦 Creating release zip and changelog..."
        
        # Determine release version (use Paper version if available, otherwise Purpur, otherwise PNX)
        if [ "${{ steps.check-paper.outputs.paper_updated }}" == "true" ]; then
          RELEASE_VER="${{ steps.check-paper.outputs.paper_ver }}"
        elif [ "${{ steps.check-purpur.outputs.purpur_updated }}" == "true" ]; then
          RELEASE_VER="${{ steps.check-purpur.outputs.purpur_ver }}"
        else
          RELEASE_VER="${{ steps.check-pnx.outputs.pnx_version }}"
        fi
        
        # Create zip file with proper name
        ZIP_NAME="AdityaMods Server Software ${RELEASE_VER}.zip"
        echo "Creating: ${ZIP_NAME}"
        
        # Create zip excluding .git directory
        zip -r "${ZIP_NAME}" . -x ".git/*" -x "${ZIP_NAME}" -x "CHANGELOG.md"
        
        echo "✅ Zip created: ${ZIP_NAME}"
        
        # Create CHANGELOG.md
        cat > CHANGELOG.md << EOF
# Changelog - AdityaMods Server Software ${RELEASE_VER}

## 🎮 Release Date: $(date '+%Y-%m-%d %H:%M:%S UTC')

## 📦 Updated Components:

EOF
        
        if [ "${{ steps.check-paper.outputs.paper_updated }}" == "true" ]; then
          echo "- ✅ **PaperMC** updated to \`${{ steps.check-paper.outputs.paper_version }}\`" >> CHANGELOG.md
        fi
        
        if [ "${{ steps.check-purpur.outputs.purpur_updated }}" == "true" ]; then
          echo "- ✅ **Purpur** updated to \`${{ steps.check-purpur.outputs.purpur_version }}\`" >> CHANGELOG.md
        fi
        
        if [ "${{ steps.check-pnx.outputs.pnx_updated }}" == "true" ]; then
          echo "- ✅ **PowerNukkitX** updated to \`${{ steps.check-pnx.outputs.pnx_version }}\`" >> CHANGELOG.md
        fi
        
        cat >> CHANGELOG.md << EOF

## 📝 What's New:

This release includes the latest Minecraft server software versions with automatic updates:

- Auto-detected latest versions from official APIs
- Updated download URLs in menu.sh
- Version tracking files updated
- All scripts tested and verified

## 🚀 How to Use:

1. Download the zip file below
2. Extract and run \`bash install.sh\`
3. Use \`mc -s setup\` to configure
4. Use \`mc -s start\` to run your server!

## 📋 Current Versions:

| Software | Version |
|----------|---------|
| PaperMC | ${{ steps.check-paper.outputs.paper_version || 'No update' }} |
| Purpur | ${{ steps.check-purpur.outputs.purpur_version || 'No update' }} |
| PowerNukkitX | ${{ steps.check-pnx.outputs.pnx_version || 'No update' }} |

## 🔧 Files Updated:

- \`menu.sh\` - Updated download URLs
- \`versions/*.version\` - Version tracking files
- \`CHANGELOG.md\` - This changelog

---
**Auto-generated by GitHub Actions** 🤖  
**Repository:** https://github.com/${{ github.repository }}
EOF
        
        echo "✅ Changelog created: CHANGELOG.md"
        echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
        echo "release_ver=${RELEASE_VER}" >> $GITHUB_OUTPUT
      id: create-zip
    
    - name: Create GitHub Release
      if: steps.check-paper.outputs.paper_updated == 'true' || steps.check-purpur.outputs.purpur_updated == 'true' || steps.check-pnx.outputs.pnx_updated == 'true'
      uses: actions/create-release@v1
      id: create-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.create-zip.outputs.release_ver }}-${{ github.run_number }}
        release_name: "AdityaMods Server Software ${{ steps.create-zip.outputs.release_ver }}"
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      if: steps.check-paper.outputs.paper_updated == 'true' || steps.check-purpur.outputs.purpur_updated == 'true' || steps.check-pnx.outputs.pnx_updated == 'true'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ${{ steps.create-zip.outputs.zip_name }}
        asset_name: ${{ steps.create-zip.outputs.zip_name }}
        asset_content_type: application/zip
    
    - name: No Updates
      if: steps.check-paper.outputs.paper_updated != 'true' && steps.check-purpur.outputs.purpur_updated != 'true' && steps.check-pnx.outputs.pnx_updated != 'true'
      run: |
        echo "✓ All server software is up to date. No changes needed."
        echo ""
        echo "Current versions:"
        cat versions/*.version 2>/dev/null || echo "No versions tracked yet"
